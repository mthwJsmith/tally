[package]
name = "tally"
version = "0.1.0"
edition = "2021"
description = "Self-hosted personal finance OS — multi-bank UK Open Banking sync via TrueLayer + TanStack web UI"
license = "MIT"
repository = "https://github.com/mthwjsmith/tally"

[dependencies]
# Web framework
axum = { version = "0.8", features = ["macros", "tokio"] }
tokio = { version = "1.40", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "fs", "set-header", "limit"] }
tower-sessions = "0.14"
tower-sessions-sqlx-store = { version = "0.15", features = ["sqlite"] }
axum-login = "0.18"

# HTTP client
reqwest = { version = "0.12", features = ["json", "rustls-tls", "cookies"], default-features = false }

# Database (pure-Rust SQLite, no CGO needed for ARM cross-compile)
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "chrono", "migrate"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Templates (compile-time HTML); rendered manually via Html(render()) — no axum-coupled crate.
askama = "0.12"

# Crypto for token-at-rest encryption
chacha20poly1305 = "0.10"
rand = "0.8"
base64 = "0.22"
argon2 = "0.5"  # password-hash for any local-admin gating

# JWT decode (to extract credentials_id from TrueLayer access tokens)
jsonwebtoken = "9"

# Scheduling
tokio-cron-scheduler = "0.13"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Error handling
anyhow = "1"
thiserror = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Env config
dotenvy = "0.15"

# URL encoding for OAuth flow
serde_urlencoded = "0.7"

# v2: rule engine, auth, CSV import
regex = "1"
totp-rs = { version = "5.5", features = ["qr", "gen_secret"] }
axum-extra = { version = "0.10", features = ["typed-header", "cookie"] }
csv = "1"
sha2 = "0.11"
time = "0.3"

[profile.release]
opt-level = "z"      # optimise for size
lto = true            # link-time optimization
codegen-units = 1     # better optimisation, slower compile
strip = true          # strip debug symbols
panic = "abort"       # smaller binary
